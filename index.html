<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prep Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Prep Tracker</h1>
    <p class="sub">Your emergency supplies, at a glance.</p>
  </header>

  <main>
    <!-- Readiness summary -->
    <section class="summary" aria-label="Summary">
      <div class="stat"><span class="num" id="stat-items">0</span><span class="label">Items</span></div>
      <div class="stat warn"><span class="num" id="stat-soon">0</span><span class="label">Expiring ≤ 60 days</span></div>
      <div class="stat bad"><span class="num" id="stat-expired">0</span><span class="label">Expired</span></div>
      <div class="stat"><span class="num" id="stat-water">0</span><span class="label">Days of water</span></div>
    </section>

    <section class="household">
      <label>People in household
        <input type="number" id="people" min="1" value="2">
      </label>
      <span class="hint">Water goal: 1 gallon per person per day, at least 3 days (14 is better).</span>
    </section>

    <!-- Add / edit form -->
    <section class="card">
      <h2 id="form-title">Add an item</h2>
      <form id="item-form" autocomplete="off">
        <input type="hidden" id="item-id">
        <div class="grid">
          <label class="wide">Name
            <input id="name" required placeholder="e.g. Canned black beans">
          </label>
          <label>Category
            <select id="category"></select>
          </label>
          <label>Quantity
            <input id="quantity" type="number" min="0" step="any" value="1" required>
          </label>
          <label>Unit
            <input id="unit" placeholder="cans, gallons, rolls…" list="unit-list">
          </label>
          <label>Expires
            <input id="expires" type="date">
          </label>
          <label>Location
            <input id="location" placeholder="Garage shelf, go-bag…" list="location-list">
          </label>
          <label class="wide">Notes
            <input id="notes" placeholder="Optional">
          </label>
        </div>
        <div class="actions">
          <button type="submit" class="primary" id="submit-btn">Add item</button>
          <button type="button" id="cancel-edit" hidden>Cancel</button>
        </div>
      </form>
      <datalist id="unit-list"></datalist>
      <datalist id="location-list"></datalist>
    </section>

    <!-- Inventory -->
    <section class="card">
      <div class="list-head">
        <h2>Inventory</h2>
        <div class="filters">
          <input id="search" type="search" placeholder="Search…">
          <select id="filter-category"><option value="">All categories</option></select>
          <select id="filter-status">
            <option value="">Any status</option>
            <option value="expired">Expired</option>
            <option value="soon">Expiring soon</option>
            <option value="ok">OK</option>
          </select>
        </div>
      </div>
      <ul id="items" class="items"></ul>
      <p id="empty" class="empty">No items yet. Add your first supply above.</p>
    </section>

    <section class="data-tools">
      <button id="export-btn">Export backup</button>
      <label class="file-btn">Import backup
        <input type="file" id="import-file" accept="application/json" hidden>
      </label>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
